name: Store release
# Runs when the mobile Release PR is merged (release-please tags mobile-vX.Y.Z), or by hand.
# Builds both store binaries and uploads them to TestFlight and Play internal testing.
# Sending a version for review stays a manual step.

on:
  push:
    tags: ['mobile-v*']
  workflow_dispatch: {}

jobs:
  build_ios:
    name: Build iOS
    type: build
    params:
      platform: ios
      profile: production

  build_android:
    name: Build Android
    type: build
    params:
      platform: android
      profile: production

  submit_ios:
    name: Upload to TestFlight
    needs: [build_ios]
    type: submit
    params:
      build_id: ${{ needs.build_ios.outputs.build_id }}
      profile: production

  submit_android:
    name: Upload to Play internal testing
    needs: [build_android]
    type: submit
    params:
      build_id: ${{ needs.build_android.outputs.build_id }}
      profile: production
