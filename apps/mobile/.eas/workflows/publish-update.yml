name: Publish update

# Run by hand (eas workflow:run publish-update.yml) to ship a JavaScript-only
# change to installed builds of the same app version.
on:
  workflow_dispatch:
    inputs:
      channel:
        type: choice
        options:
          - production
          - preview
        default: production
      message:
        type: string
        required: false

# One job per platform: "all" would also export web, which the app doesn't ship.
jobs:
  publish_android:
    name: Publish Android update
    type: update
    environment: ${{ inputs.channel || 'production' }}
    # Same default server the build profiles in eas.json set.
    env:
      EXPO_PUBLIC_MYREL_SERVER: https://myrel.fibteq.io
    params:
      platform: android
      branch: ${{ inputs.channel || 'production' }}
      message: ${{ inputs.message || github.commit_message }}
  publish_ios:
    name: Publish iOS update
    type: update
    environment: ${{ inputs.channel || 'production' }}
    env:
      EXPO_PUBLIC_MYREL_SERVER: https://myrel.fibteq.io
    params:
      platform: ios
      branch: ${{ inputs.channel || 'production' }}
      message: ${{ inputs.message || github.commit_message }}
