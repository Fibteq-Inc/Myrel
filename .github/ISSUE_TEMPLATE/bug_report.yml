name: Bug report
description: Something in Altair does not work as expected.
labels: [bug]
body:
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Create a project
        2. Ask "..." in the project chat
        3. ...
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where does it happen?
      options:
        - Self-hosted on Cloudflare
        - Local development (pnpm dev)
        - Desktop app
        - Mobile app
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: The release tag or commit SHA you run.
  - type: input
    id: provider
    attributes:
      label: Model provider and model
      description: The values of LLM_PROVIDER and LLM_MODEL, if the bug involves agents.
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Worker logs or browser console output. Remove keys, tokens and personal data first.
      render: text
