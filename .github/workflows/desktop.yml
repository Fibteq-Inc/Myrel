name: Desktop

# Builds the Tauri app for macOS, Windows and Linux.
# Builds only run from main. Pull requests don't build the app; CI's typecheck and build already cover
# the desktop and runner TypeScript.
# Releases: merging the desktop Release PR (release-please.yml) tags `desktop-v*`, creates the GitHub
# release and calls this workflow with that tag. A `desktop-v*` tag pushed by hand works the same way.
# Manual runs on main upload unsigned-for-release installers as workflow artifacts. A manual run with a tag
# rebuilds that release from its tag (e.g. when one platform failed) and replaces its installers.
# Release notes list the pull requests since the previous desktop tag that changed the app
# (apps/desktop/scripts/release-notes.sh).
# Release builds: signed builds (when the secrets below exist) attached to a draft GitHub release,
# plus `latest.json` for the in-app updater.
#
# Optional secrets (the build still runs without them, just unsigned):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY  macOS code signing
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                macOS notarization
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD          updater signatures
# With APPLE_CERTIFICATE set, APPLE_SIGNING_IDENTITY is not passed to the build: the bundler signs with the
# imported certificate from its own temporary keychain, and it rejects an identity (such as a SHA-1
# fingerprint) that isn't part of that certificate's name.
# Optional variables:
#   TAURI_UPDATER_PUBKEY   public half of TAURI_SIGNING_PRIVATE_KEY
#   MYREL_DESKTOP_API_URL default server the app opens on (users can change it)

on:
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Rebuild an existing release, e.g. desktop-v0.2.0 (leave empty for a test build of main)
        type: string
        required: false
  workflow_call:
    inputs:
      tag:
        description: Release tag to build and attach the installers to, e.g. desktop-v0.2.0
        type: string
        required: true

concurrency:
  group: desktop-${{ inputs.tag || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  # Stops tags on commits that aren't on main, and manual runs started from another branch.
  from-main:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Check the commit is on main
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          git merge-base --is-ancestor "$GITHUB_SHA" origin/main || {
            echo "::error::Desktop builds only run from main; $GITHUB_REF is not on main."
            exit 1
          }
          if [ -n "$TAG" ]; then
            git merge-base --is-ancestor "refs/tags/$TAG" origin/main || {
              echo "::error::$TAG is not a tag on main."
              exit 1
            }
          fi

  build:
    needs: from-main
    env:
      # The release to attach installers to: the Release PR's tag, a pushed tag, or none for manual runs.
      RELEASE_TAG: ${{ inputs.tag || (startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name) || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    # While the repository is private, macOS builds on the org's self-hosted Mac, because GitHub's hosted
    # macOS runners often never pick up the job there. Once the repository is public it uses hosted runners.
    runs-on: ${{ matrix.os == 'macos-latest' && github.event.repository.private && fromJSON('["self-hosted", "macOS"]') || matrix.os }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # A release builds the tagged commit, also when a manual run on main rebuilds it.
          ref: ${{ env.RELEASE_TAG || github.sha }}
      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm
      # Compiles the bundled myrel-runner sidecar into one executable (apps/desktop/scripts/build-runner.mjs).
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable
        with:
          # The action reads the toolchain from its ref; pinned to a commit, it is named here.
          toolchain: stable
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Use signing secrets when present
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # The bundler signs with the imported certificate and rejects an identity that isn't in its name.
          if [ -n "$APPLE_CERTIFICATE" ]; then
            APPLE_SIGNING_IDENTITY=""
          fi
          # Empty variables would make the bundler try (and fail) to sign, so only export the ones that are set.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__MYREL_EOF__"; printf '%s\n' "${!name}"; echo "__MYREL_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          # Updater artifacts need both halves of the key pair.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            jq -n --arg pubkey "$UPDATER_PUBKEY" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey}}}' \
              > apps/desktop/src-tauri/tauri.ci.conf.json
            echo "TAURI_EXTRA_ARGS=--config src-tauri/tauri.ci.conf.json" >> "$GITHUB_ENV"
            echo "UPDATER_JSON=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        # Pinned to a commit: this step holds the signing secrets and a token that can write releases.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.MYREL_DESKTOP_API_URL || 'https://myrel.fibteq.io' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}
          includeUpdaterJson: ${{ env.UPDATER_JSON == 'true' }}
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: ${{ env.RELEASE_TAG && 'Myrel Desktop __VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        if: env.RELEASE_TAG == ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: myrel-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error
          retention-days: 14

  # Replaces the release body with the pull requests that changed the app since the previous desktop tag.
  # release-please's changelog only sees Conventional Commits under its paths, which misses most of them.
  notes:
    needs: build
    if: ${{ !cancelled() && (inputs.tag || startsWith(github.ref, 'refs/tags/desktop-v')) }}
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Write release notes
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          apps/desktop/scripts/release-notes.sh "$RELEASE_TAG" > "$RUNNER_TEMP/notes.md"
          cat "$RUNNER_TEMP/notes.md"
          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file "$RUNNER_TEMP/notes.md"
