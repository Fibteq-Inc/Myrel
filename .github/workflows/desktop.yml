name: Desktop

# Builds the Tauri app for macOS, Windows and Linux.
# Pull requests: unsigned builds, uploaded as workflow artifacts for testing.
# Tags `desktop-v*`: signed builds (when the secrets below exist) attached to a draft GitHub release,
# plus `latest.json` for the in-app updater.
#
# Optional secrets (the build still runs without them, just unsigned):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY  macOS code signing
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                macOS notarization
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD          updater signatures
# Optional variables:
#   TAURI_UPDATER_PUBKEY   public half of TAURI_SIGNING_PRIVATE_KEY
#   ALTAIR_DESKTOP_API_URL default server the app opens on (users can change it)

on:
  pull_request:
    paths:
      - apps/desktop/**
      - apps/web/**
      - packages/client/**
      - packages/protocol/**
      - pnpm-lock.yaml
      - .github/workflows/desktop.yml
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      - name: Use signing secrets when present
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # Empty variables would make the bundler try (and fail) to sign, so only export the ones that are set.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__ALTAIR_EOF__"; printf '%s\n' "${!name}"; echo "__ALTAIR_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          # Updater artifacts need both halves of the key pair.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            jq -n --arg pubkey "$UPDATER_PUBKEY" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey}}}' \
              > apps/desktop/src-tauri/tauri.ci.conf.json
            echo "TAURI_EXTRA_ARGS=--config src-tauri/tauri.ci.conf.json" >> "$GITHUB_ENV"
            echo "UPDATER_JSON=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.ALTAIR_DESKTOP_API_URL }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}
          includeUpdaterJson: ${{ env.UPDATER_JSON == 'true' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'Altair Desktop __VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: altair-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error
          retention-days: 14
