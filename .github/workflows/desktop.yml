name: Desktop

# Builds the Tauri app for macOS, Windows and Linux.
# Pull requests touching the desktop app or runner: unsigned builds, uploaded as workflow artifacts for testing.
# Tags `desktop-v*`: signed builds (when the secrets below exist) attached to a draft GitHub release,
# plus `latest.json` for the in-app updater.
#
# Optional secrets (the build still runs without them, just unsigned):
#   APPLE_CERTIFICATE, APPLE_CERTIFICATE_PASSWORD, APPLE_SIGNING_IDENTITY  macOS code signing
#   APPLE_ID, APPLE_PASSWORD, APPLE_TEAM_ID                                macOS notarization
#   TAURI_SIGNING_PRIVATE_KEY, TAURI_SIGNING_PRIVATE_KEY_PASSWORD          updater signatures
# APPLE_SIGNING_IDENTITY may be the certificate's SHA-1 fingerprint, which stays unambiguous on a Mac that
# also has an older certificate with the same name.
# Optional variables:
#   TAURI_UPDATER_PUBKEY   public half of TAURI_SIGNING_PRIVATE_KEY
#   MYREL_DESKTOP_API_URL default server the app opens on (users can change it)

on:
  # Only changes to the desktop shell or its bundled runner. Web changes are already checked by CI and
  # reach the app on the next release, so they don't pay for three native builds on every PR.
  pull_request:
    paths:
      - apps/desktop/**
      - packages/myrel-runner/**
      - .github/workflows/desktop.yml
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:

concurrency:
  group: desktop-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - os: windows-latest
            args: ""
            rust-targets: ""
          - os: ubuntu-22.04
            args: ""
            rust-targets: ""
    # While the repository is private, releases and manual runs build macOS on the org's self-hosted Mac,
    # because GitHub's hosted macOS runners often never pick up the job there. Pull requests, and every run
    # once the repository is public, use hosted runners so outside code never runs on that Mac.
    runs-on: ${{ matrix.os == 'macos-latest' && github.event_name != 'pull_request' && github.event.repository.private && fromJSON('["self-hosted", "macOS"]') || matrix.os }}
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      # Compiles the bundled myrel-runner sidecar into one executable (apps/desktop/scripts/build-runner.mjs).
      - uses: oven-sh/setup-bun@v2
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libssl-dev libxdo-dev

      - run: pnpm install --frozen-lockfile

      # Pull requests build unsigned: the signing and notarization secrets only reach tag and manual runs.
      - name: Use signing secrets when present
        if: github.event_name != 'pull_request'
        shell: bash
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          UPDATER_PUBKEY: ${{ vars.TAURI_UPDATER_PUBKEY }}
        run: |
          # Empty variables would make the bundler try (and fail) to sign, so only export the ones that are set.
          for name in APPLE_CERTIFICATE APPLE_CERTIFICATE_PASSWORD APPLE_SIGNING_IDENTITY APPLE_ID APPLE_PASSWORD APPLE_TEAM_ID TAURI_SIGNING_PRIVATE_KEY TAURI_SIGNING_PRIVATE_KEY_PASSWORD; do
            if [ -n "${!name}" ]; then
              { echo "$name<<__MYREL_EOF__"; printf '%s\n' "${!name}"; echo "__MYREL_EOF__"; } >> "$GITHUB_ENV"
            fi
          done
          # Updater artifacts need both halves of the key pair.
          if [ -n "$TAURI_SIGNING_PRIVATE_KEY" ] && [ -n "$UPDATER_PUBKEY" ]; then
            jq -n --arg pubkey "$UPDATER_PUBKEY" \
              '{bundle: {createUpdaterArtifacts: true}, plugins: {updater: {pubkey: $pubkey}}}' \
              > apps/desktop/src-tauri/tauri.ci.conf.json
            echo "TAURI_EXTRA_ARGS=--config src-tauri/tauri.ci.conf.json" >> "$GITHUB_ENV"
            echo "UPDATER_JSON=true" >> "$GITHUB_ENV"
          fi

      - name: Build
        # Pinned to a commit: this step holds the signing secrets and a token that can write releases.
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_API_URL: ${{ vars.MYREL_DESKTOP_API_URL || 'https://myrel.fibteq.io' }}
        with:
          projectPath: apps/desktop
          tauriScript: pnpm tauri
          args: ${{ matrix.args }} ${{ env.TAURI_EXTRA_ARGS }}
          includeUpdaterJson: ${{ env.UPDATER_JSON == 'true' }}
          tagName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/desktop-v') && 'Myrel Desktop __VERSION__' || '' }}
          releaseDraft: true
          prerelease: false

      - name: Upload installers
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        uses: actions/upload-artifact@v4
        with:
          name: myrel-desktop-${{ runner.os }}
          path: |
            apps/desktop/src-tauri/target/release/bundle/
            apps/desktop/src-tauri/target/*/release/bundle/
          if-no-files-found: error
          retention-days: 14
