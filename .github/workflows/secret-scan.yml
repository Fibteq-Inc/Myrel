name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfLo gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz
          echo "a65b5253807a68ac0cafa4414031fd740aeb55f54fb7e55f386acb52e6a840eb  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz -C /usr/local/bin gitleaks
          rm gitleaks.tar.gz
      # gitleaks scans every ref by default, so a leak on one feature branch would
      # turn every pull request red. Pull requests scan only their own commits;
      # pushes to main scan main's full history.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact --verbose --log-opts="origin/${{ github.base_ref }}..HEAD" .
      - name: Scan main's full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --verbose --log-opts="HEAD" .
