name: Secret scan

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  gitleaks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Install gitleaks
        run: |
          curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.28.0/gitleaks_8.28.0_linux_x64.tar.gz \
            | tar -xz -C /usr/local/bin gitleaks
      # gitleaks scans every ref by default, so a leak on one feature branch would
      # turn every pull request red. Pull requests scan only their own commits;
      # pushes to main scan main's full history.
      - name: Scan the pull request's commits
        if: github.event_name == 'pull_request'
        run: gitleaks git --redact --verbose --log-opts="origin/${{ github.base_ref }}..HEAD" .
      - name: Scan main's full history
        if: github.event_name != 'pull_request'
        run: gitleaks git --redact --verbose --log-opts="HEAD" .
