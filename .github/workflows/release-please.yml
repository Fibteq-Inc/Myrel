name: Release PRs

# Keeps one "Release PR" per app open on main (release-please, config in release-please-config.json).
# Each feat/fix commit that touches an app updates its PR with the next version and CHANGELOG. Merging the
# PR tags the release (e.g. `desktop-v0.2.0`), creates the GitHub release and starts the app's build.
#
# Needs: Settings > Actions > General > "Allow GitHub Actions to create and approve pull requests".

on:
  push:
    branches: [main]

concurrency:
  group: release-please
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      desktop-released: ${{ steps.release.outputs['apps/desktop--release_created'] }}
      desktop-tag: ${{ steps.release.outputs['apps/desktop--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # A tag pushed with GITHUB_TOKEN doesn't start other workflows, so the desktop build is called directly.
  desktop:
    needs: release-please
    if: needs.release-please.outputs.desktop-released == 'true'
    uses: ./.github/workflows/desktop.yml
    with:
      tag: ${{ needs.release-please.outputs.desktop-tag }}
    secrets: inherit
    permissions:
      contents: write
